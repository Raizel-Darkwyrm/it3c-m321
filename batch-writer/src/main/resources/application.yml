spring:
  application:
    name: batch-writer
  main:
    # Der Writer bietet keine HTTP-Schnittstelle an.
    web-application-type: none
  datasource:
    # Compose setzt den internen Host; Zugangsdaten kommen aus der Umgebung.
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Millisekunden: Pool-Warten darf nicht das gesamte Versuchsbudget verbrauchen.
      connection-timeout: 1000
      validation-timeout: 500
      initialization-fail-timeout: -1
      minimum-idle: 0
      maximum-pool-size: 2
      data-source-properties:
        # pgJDBC verwendet hier Sekunden, PostgreSQL bei den Optionen Millisekunden.
        connectTimeout: 1
        loginTimeout: 1
        socketTimeout: 1
        cancelSignalTimeout: 1
        options: "-c statement_timeout=1500 -c lock_timeout=750"
  sql:
    init:
      # Das Schema gehört dem PostgreSQL-Init-Skript, nicht den Writer-Instanzen.
      mode: never
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5672
    virtual-host: /
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      type: simple
      simple:
        # Offene Lieferungen bleiben bis zur ausdrücklichen Bestätigung beim Broker.
        acknowledge-mode: manual
        prefetch: 500
        concurrency: 1
        max-concurrency: 1
