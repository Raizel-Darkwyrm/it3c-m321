# Bewertung 1: Producer, Broker, Datenbank und skalierbarer batch-writer.
services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Das Schema entsteht nur beim ersten Start mit leerem Datenverzeichnis.
      - ./postgres/init/001-create-message.sql:/docker-entrypoint-initdb.d/001-create-message.sql:ro
    networks:
      - chat-net
    healthcheck:
      # TCP vermeidet die Bereitschaftsmeldung des temporären Init-Servers.
      # $$ verschiebt die Variablenauflösung von Compose in den Container.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management
    # RabbitMQ verwendet den Hostnamen für seine Knoten- und Datenverzeichniskennung.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - chat-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - chat-net

  batch-writer:
    build:
      context: .
      dockerfile: batch-writer/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - chat-net
    # Zeit für die fünfsekündige Schonfrist und den anschliessenden Verbindungsabbau.
    stop_grace_period: 30s
    # Kein fester Containername: --scale batch-writer=2 erzeugt unabhängige Instanzen.

# KEIN ports:-Eintrag in dieser Datei. Der einzige offene Port des
# Gesamtsystems gehört später dem web-gateway.
networks:
  chat-net:
    name: chat-net

# Die Daten überleben einen normalen Neustart oder Ersatz des Containers.
volumes:
    postgres-data:
    rabbitmq-data:
